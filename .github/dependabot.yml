version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    # New releases wait a week before a PR opens; security updates do not wait.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # TypeScript 7 has no JavaScript compiler API, and typescript-eslint (inside
    # eslint-config-next, in CI and in the editor) refuses it until its support
    # for TS >= 7.1 (typescript-eslint/typescript-eslint#10940). Stay on 6.0.x,
    # the bridge release, until then.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      prod-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
