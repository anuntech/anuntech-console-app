name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      BETTER_AUTH_URL: http://localhost:3100
      BETTER_AUTH_SECRET: ci-build-only-not-a-production-secret-2026
      GOOGLE_CLIENT_ID: ci-build-only
      GOOGLE_CLIENT_SECRET: ci-build-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
